<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเว็บบล็อก</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    .rich-editor:empty:before {
      content: attr(placeholder);
      color: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('home')">
        <div class="w-9 h-9 rounded-lg bg-indigo-600 text-white font-bold flex items-center justify-center shadow-sm shadow-indigo-200">B</div>
        <span class="font-bold text-xl text-slate-800 tracking-tight">MyBlog</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-nav-home" onclick="navigate('home')" class="px-3.5 py-1.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700">หน้าแรก</button>
        <button id="btn-nav-write" onclick="openWritePage()" class="hidden px-3.5 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">เขียนบทความ</button>
        <div class="ml-2 pl-2 border-l border-slate-200">
          <button id="btn-auth-action" onclick="handleAuthAction()" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-indigo-200 text-indigo-600 hover:bg-indigo-50">เข้าสู่ระบบ</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- 1. Home View (หน้ารายการบทความทั้งหมด) -->
    <section id="page-home" class="space-y-6">
      
      <!-- Bar แถวบน: หัวข้อ + สลับ Layout + รีเฟรช -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-200 gap-4">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">บทความทั้งหมด</h1>
          <p class="text-xs text-slate-500 mt-0.5">แบ่งปันความรู้ สาระ และไอเดียที่น่าสนใจ</p>
        </div>

        <div class="flex items-center gap-3">
          <!-- สลับมุมมอง -->
          <div class="flex items-center bg-slate-200/70 p-1 rounded-lg border border-slate-200 text-xs">
            <button id="view-btn-grid" onclick="changeLayout('grid')" class="p-1.5 rounded-md transition" title="ตารางการ์ด (Grid)">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
            </button>
            <button id="view-btn-list" onclick="changeLayout('list')" class="p-1.5 rounded-md transition" title="รายการแนวนอน (List)">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <button id="view-btn-magazine" onclick="changeLayout('magazine')" class="p-1.5 rounded-md transition" title="แบบนิตยสาร (Magazine)">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
            </button>
            <button id="view-btn-compact" onclick="changeLayout('compact')" class="p-1.5 rounded-md transition" title="แบบกะทัดรัด (Compact)">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
            </button>
          </div>

          <button onclick="fetchBlogList()" class="text-xs bg-white border border-slate-300 px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-indigo-600 shadow-sm transition">รีเฟรช</button>
        </div>
      </div>

      <!-- ช่องค้นหาบทความ -->
      <div class="relative max-w-xl">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </span>
        <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="ค้นหาบทความ, เนื้อหา, หรือชื่อผู้เขียน..." class="w-full pl-9 pr-10 py-2.5 bg-white border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
        <button id="search-clear-btn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div id="loader" class="text-center py-20 text-slate-400">กำลังโหลดบทความ...</div>
      <div id="card-container" class="hidden"></div>
      <div id="empty-notice" class="hidden text-center py-20 bg-white rounded-2xl border border-dashed border-slate-200">
        <p class="text-slate-500 text-sm">ไม่พบบทความที่คุณค้นหา</p>
      </div>
    </section>

    <!-- 2. Read Article View (หน้าอ่านบทความเต็มจอ ไม่เด้งเป็นป๊อปอัพ) -->
    <section id="page-read" class="hidden max-w-5xl mx-auto space-y-6">
      <!-- Action Bar แถวด้านบน -->
      <div class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-200">
        <button onclick="navigate('home')" class="inline-flex items-center gap-1.5 px-4 py-2 bg-white border border-slate-300 rounded-xl text-xs sm:text-sm font-semibold text-slate-700 hover:bg-slate-50 hover:text-indigo-600 shadow-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
          ย้อนกลับไปหน้าแรก
        </button>

        <div class="flex items-center gap-2">
          <!-- ปุ่ม Like -->
          <button id="read-btn-like" onclick="handleLikeClick(currentArticleId)" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-semibold bg-white hover:bg-rose-50 hover:text-rose-600 text-slate-600 transition shadow-sm">
            <span id="read-like-icon">❤️</span>
            <span id="read-like-count">0</span>
          </button>
          <!-- ปุ่มแชร์ -->
          <button onclick="shareBlogPost(currentArticleId)" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-semibold bg-white hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 transition shadow-sm">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
            แชร์
          </button>
          <!-- ปุ่ม PDF -->
          <button onclick="exportToPdf()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-semibold bg-white hover:bg-emerald-50 hover:text-emerald-600 text-slate-600 transition shadow-sm">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            PDF
          </button>
          <!-- ปุ่มแก้ไข (แสดงเมื่อแอดมินล็อกอิน) -->
          <button id="read-btn-edit" onclick="startEditBlog(currentArticleId)" class="hidden inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-semibold bg-white hover:bg-amber-50 hover:text-amber-600 text-slate-600 transition shadow-sm">
            ✏️ แก้ไข
          </button>
        </div>
      </div>

      <!-- เนื้อหาบทความ (ใช้ดาวน์โหลดเป็น PDF ได้ด้วย) -->
      <article id="pdf-content-area" class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-12 shadow-sm space-y-6">
        <div>
          <h1 id="read-title" class="text-2xl sm:text-4xl font-extrabold text-slate-900 leading-tight"></h1>
          <div class="flex items-center gap-3 text-xs sm:text-sm text-slate-500 mt-4 pb-4 border-b">
            <span id="read-author" class="font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-full"></span>
            <span>•</span>
            <span id="read-date"></span>
          </div>
        </div>

        <!-- รูปภาพหน้าปกขนาดใหญ่ -->
        <div id="read-cover-wrapper" class="hidden w-full max-h-[500px] rounded-2xl overflow-hidden bg-slate-100 shadow-inner">
          <img id="read-cover-img" class="w-full h-full object-cover">
        </div>

        <!-- เนื้อหาบทความแบบเต็ม -->
        <div id="read-content" class="text-slate-700 text-base sm:text-lg leading-relaxed prose max-w-none pt-2"></div>
      </article>

      <div class="text-center pt-4 pb-8">
        <button onclick="navigate('home')" class="px-6 py-2.5 bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl hover:bg-slate-300 transition">← กลับสู่หน้ารายการบทความ</button>
      </div>
    </section>

    <!-- 3. Login View -->
    <section id="page-login" class="hidden max-w-md mx-auto my-12 bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-sm">
      <h2 class="text-xl font-bold text-center mb-1 text-slate-900">เข้าสู่ระบบผู้ดูแล</h2>
      <p class="text-xs text-center text-slate-400 mb-6">ค่าเริ่มต้น: admin / admin1234</p>
      <form onsubmit="processLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">ชื่อผู้ใช้</label>
          <input type="text" id="log-user" required class="w-full px-3.5 py-2.5 border rounded-lg text-sm focus:outline-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">รหัสผ่าน</label>
          <input type="password" id="log-pass" required class="w-full px-3.5 py-2.5 border rounded-lg text-sm focus:outline-indigo-500">
        </div>
        <button type="submit" id="btn-login-submit" class="w-full py-2.5 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700 shadow-md shadow-indigo-200">เข้าสู่ระบบ</button>
      </form>
    </section>

    <!-- 4. Write / Edit View -->
    <section id="page-write" class="hidden max-w-4xl mx-auto bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-sm">
      <div class="flex justify-between items-center mb-6 pb-3 border-b">
        <h2 id="write-heading" class="text-2xl font-bold text-slate-900">เขียนบทความใหม่</h2>
        <span id="edit-badge" class="hidden text-xs bg-amber-100 text-amber-800 px-3 py-1 rounded-full font-medium">กำลังแก้ไข</span>
      </div>

      <form onsubmit="submitBlogPost(event)" class="space-y-5">
        <input type="hidden" id="edit-blog-id" value="">

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">ชื่อบทความ *</label>
          <input type="text" id="post-title" required placeholder="หัวข้อบทความ..." class="w-full px-4 py-2.5 border rounded-lg text-sm focus:outline-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">รูปภาพหน้าปก</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <input type="url" id="post-img-url" oninput="previewCover(this.value)" placeholder="วางลิงก์รูปภาพ (URL)" class="px-3.5 py-2 border rounded-lg text-xs focus:outline-indigo-500">
            <input type="file" id="post-img-file" accept="image/*" onchange="handleFileUpload(event)" class="text-xs file:mr-2 file:py-2 file:px-3 file:rounded-md file:border-0 file:text-xs file:bg-indigo-50 file:text-indigo-700">
          </div>
          <div id="cover-preview-box" class="hidden mt-3 relative w-full h-48 bg-slate-100 rounded-xl overflow-hidden border">
            <img id="cover-preview-img" src="" class="w-full h-full object-cover">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">เรื่องย่อ (Excerpt) *</label>
          <textarea id="post-excerpt" rows="2" required placeholder="สรุปเนื้อหาสั้นๆ สำหรับแสดงบนการ์ด..." class="w-full px-4 py-2.5 border rounded-lg text-sm focus:outline-indigo-500"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">เนื้อหาบทความ *</label>
          <div class="border border-slate-300 rounded-xl overflow-hidden shadow-sm">
            <div class="bg-slate-100 border-b border-slate-300 p-2.5 flex flex-wrap gap-1.5 items-center text-xs">
              <button type="button" onclick="formatDoc('bold')" class="px-2.5 py-1 bg-white border rounded font-bold hover:bg-slate-50">B</button>
              <button type="button" onclick="formatDoc('italic')" class="px-2.5 py-1 bg-white border rounded italic hover:bg-slate-50">I</button>
              <button type="button" onclick="formatDoc('underline')" class="px-2.5 py-1 bg-white border rounded underline hover:bg-slate-50">U</button>
              <div class="h-4 w-px bg-slate-300 mx-1"></div>
              <button type="button" onclick="formatDoc('formatBlock', '<h2>')" class="px-2.5 py-1 bg-white border rounded font-bold hover:bg-slate-50">H2</button>
              <button type="button" onclick="formatDoc('formatBlock', '<h3>')" class="px-2.5 py-1 bg-white border rounded font-semibold hover:bg-slate-50">H3</button>
              <button type="button" onclick="formatDoc('formatBlock', '<p>')" class="px-2.5 py-1 bg-white border rounded hover:bg-slate-50">P</button>
              <div class="h-4 w-px bg-slate-300 mx-1"></div>
              <button type="button" onclick="formatDoc('insertUnorderedList')" class="px-2.5 py-1 bg-white border rounded hover:bg-slate-50">• List</button>
              <button type="button" onclick="formatDoc('insertOrderedList')" class="px-2.5 py-1 bg-white border rounded hover:bg-slate-50">1. List</button>
              <div class="h-4 w-px bg-slate-300 mx-1"></div>
              <button type="button" onclick="insertLinkPrompt()" class="px-2.5 py-1 bg-white border rounded hover:bg-slate-50">🔗 ลิงก์</button>
              <button type="button" onclick="insertImagePrompt()" class="px-2.5 py-1 bg-white border rounded hover:bg-slate-50">🖼️ รูป</button>
            </div>
            <div id="post-editor" contenteditable="true" placeholder="เริ่มเขียนเนื้อหา..." class="rich-editor p-4 min-h-[250px] focus:outline-none text-sm leading-relaxed max-w-none prose"></div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">ชื่อผู้เขียน *</label>
          <input type="text" id="post-author" required class="w-full px-4 py-2.5 border rounded-lg text-sm bg-slate-50 focus:outline-indigo-500">
        </div>

        <div class="pt-4 flex justify-end gap-3">
          <button type="button" onclick="navigate('home')" class="px-5 py-2.5 border rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50">ยกเลิก</button>
          <button type="submit" id="btn-save" class="px-6 py-2.5 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700 shadow-md shadow-indigo-200">บันทึกบทความ</button>
        </div>
      </form>
    </section>

  </main>

  <script>
    let rawBlogList = [];
    let filteredBlogList = [];
    let sessionUser = null;
    let sessionToken = null;
    let currentCoverData = "";
    let currentArticleId = null;
    let currentLayout = localStorage.getItem('blog_layout_mode') || 'grid';

    window.addEventListener('DOMContentLoaded', () => {
      const u = localStorage.getItem('app_user');
      const t = localStorage.getItem('app_token');
      if (u && t) {
        sessionUser = JSON.parse(u);
        sessionToken = t;
      }
      refreshAuthBar();
      updateLayoutButtonsUI();
      fetchBlogList();
    });

    // ค้นหาบทความ
    function handleSearch(keyword) {
      const clearBtn = document.getElementById('search-clear-btn');
      const term = keyword.trim().toLowerCase();

      if (term) {
        clearBtn.classList.remove('hidden');
        filteredBlogList = rawBlogList.filter(item => {
          return item.title.toLowerCase().includes(term) ||
                 item.excerpt.toLowerCase().includes(term) ||
                 item.author.toLowerCase().includes(term) ||
                 item.content.toLowerCase().includes(term);
        });
      } else {
        clearBtn.classList.add('hidden');
        filteredBlogList = [...rawBlogList];
      }
      renderBlogs();
    }

    function clearSearch() {
      const input = document.getElementById('search-input');
      input.value = '';
      handleSearch('');
      input.focus();
    }

    // สลับ Layout
    function changeLayout(mode) {
      currentLayout = mode;
      localStorage.setItem('blog_layout_mode', mode);
      updateLayoutButtonsUI();
      renderBlogs();
    }

    function updateLayoutButtonsUI() {
      const modes = ['grid', 'list', 'magazine', 'compact'];
      modes.forEach(m => {
        const btn = document.getElementById(`view-btn-${m}`);
        if (!btn) return;
        if (m === currentLayout) {
          btn.className = "p-1.5 rounded-md transition bg-white text-indigo-600 shadow-sm font-semibold";
        } else {
          btn.className = "p-1.5 rounded-md transition text-slate-500 hover:text-slate-800";
        }
      });
    }

    function renderBlogs() {
      const box = document.getElementById('card-container');
      const empty = document.getElementById('empty-notice');

      if (!filteredBlogList || filteredBlogList.length === 0) {
        box.classList.add('hidden');
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      box.className = "";
      box.innerHTML = "";

      if (currentLayout === 'grid') {
        renderGridView(box);
      } else if (currentLayout === 'list') {
        renderListView(box);
      } else if (currentLayout === 'magazine') {
        renderMagazineView(box);
      } else if (currentLayout === 'compact') {
        renderCompactView(box);
      }

      box.classList.remove('hidden');
    }

    // 1. Grid View
    function renderGridView(box) {
      box.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6";
      filteredBlogList.forEach(item => {
        const isLiked = localStorage.getItem('liked_' + item.id);
        const card = document.createElement('div');
        card.className = "bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm flex flex-col hover:shadow-lg hover:border-indigo-100 transition duration-200";
        const coverHtml = item.coverImage 
          ? `<div class="h-48 w-full bg-slate-100 overflow-hidden cursor-pointer" onclick="viewArticleDetail('${item.id}')"><img src="${item.coverImage}" class="w-full h-full object-cover hover:scale-105 transition duration-300"></div>` 
          : '';

        card.innerHTML = `
          ${coverHtml}
          <div class="p-6 flex-grow flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center text-xs text-slate-400 mb-2.5">
                <span class="text-indigo-600 font-semibold bg-indigo-50 px-2 py-0.5 rounded-full">${escapeHtml(item.author)}</span>
                <span>${item.timestamp}</span>
              </div>
              <h3 onclick="viewArticleDetail('${item.id}')" class="font-bold text-base text-slate-800 mb-2 line-clamp-2 cursor-pointer hover:text-indigo-600">${escapeHtml(item.title)}</h3>

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 1200;

          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
          previewCover(compressedDataUrl);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function processLogin(e) {
      e.preventDefault();
      const u = document.getElementById('log-user').value;
      const p = document.getElementById('log-pass').value;
      const btn = document.getElementById('btn-login-submit');

      btn.disabled = true;
      btn.innerText = "กำลังตรวจสอบ...";

      google.script.run
        .withSuccessHandler((res) => {
          btn.disabled = false;
          btn.innerText = "เข้าสู่ระบบ";
          if (res.success) {
            sessionUser = res.user;
            sessionToken = res.token;
            localStorage.setItem('app_user', JSON.stringify(sessionUser));
            localStorage.setItem('app_token', sessionToken);
            refreshAuthBar();
            Swal.fire({ icon: 'success', title: 'สำเร็จ', text: 'ยินดีต้อนรับ ' + res.user.name, timer: 1200, showConfirmButton: false });
            resetWriteForm();
            navigate('write');
          } else {
            Swal.fire({ icon: 'error', title: 'ไม่สำเร็จ', text: res.message });
          }
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          btn.innerText = "เข้าสู่ระบบ";
          Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: err.message });
        })
        .loginUser(u, p);
    }

      const empty = document.getElementById('empty-notice');

      loader.classList.remove('hidden');
      box.classList.add('hidden');
      empty.classList.add('hidden');

      google.script.run
        .withSuccessHandler((data) => {
          rawBlogList = data || [];
          filteredBlogList = [...rawBlogList];
          loader.classList.add('hidden');
          const curSearch = document.getElementById('search-input').value;
          if (curSearch) {
            handleSearch(curSearch);

        .withFailureHandler((err) => {

            const b = rawBlogList.find(x => x.id === id);

            renderBlogs();

    function shareBlogPost(id) {
      const b = rawBlogList.find(x => x.id === id);
      if (!b) return;

      const pageUrl = window.location.href;
      if (navigator.share) {
        navigator.share({ title: b.title, text: b.excerpt, url: pageUrl }).catch(() => {});
      } else {
        Swal.fire({
          title: 'แชร์บทความ',
          html: `
            <div class="flex justify-center gap-3 py-3">
              <a href="https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(pageUrl)}" target="_blank" class="px-3 py-2 bg-emerald-500 text-white rounded-lg text-xs font-semibold hover:bg-emerald-600">LINE</a>
              <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(pageUrl)}" target="_blank" class="px-3 py-2 bg-blue-600 text-white rounded-lg text-xs font-semibold hover:bg-blue-700">Facebook</a>
              <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(b.title)}&url=${encodeURIComponent(pageUrl)}" target="_blank" class="px-3 py-2 bg-slate-800 text-white rounded-lg text-xs font-semibold hover:bg-black">X</a>
            </div>
            <input type="text" readonly value="${pageUrl}" class="w-full mt-2 px-2 py-1.5 border rounded text-xs text-center text-slate-500 bg-slate-50">
          `,
          showCancelButton: true,
          confirmButtonText: 'คัดลอกลิงก์',
          cancelButtonText: 'ปิด'
        }).then((result) => {
          if (result.isConfirmed) {
            navigator.clipboard.writeText(pageUrl);
            Swal.fire({ icon: 'success', title: 'คัดลอกลิงก์แล้ว', timer: 1200, showConfirmButton: false });
          }
        });
      }
    }

      const element = document.getElementById('pdf-content-area');
      const b = rawBlogList.find(x => x.id === currentArticleId);
      const title = b ? b.title : 'บทความ';

      const opt = {
        margin:       [10, 10, 10, 10],
        filename:     `${title}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      Swal.fire({
        title: 'กำลังสร้างไฟล์ PDF...',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      html2pdf().set(opt).from(element).save().then(() => {
        Swal.close();
      }).catch(err => {
        Swal.fire({ icon: 'error', title: 'ส่งออกไม่สำเร็จ', text: err.message });
      });
    }

      document.getElementById('post-author').value = b.author;
      
      if (b.coverImage) {
        document.getElementById('post-img-url').value = b.coverImage.startsWith('data:') ? '' : b.coverImage;
        previewCover(b.coverImage);
      } else {
        previewCover('');
      }

      navigate('write');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function submitBlogPost(e) {
      e.preventDefault();
      const editorHtml = document.getElementById('post-editor').innerHTML.trim();
      if (!editorHtml || editorHtml === '<br>') {
        Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบ', text: 'กรุณากรอกเนื้อหาบทความ' });
        return;
      }

      const editId = document.getElementById('edit-blog-id').value;
      const payload = {
        id: editId || null,
        title: document.getElementById('post-title').value.trim(),
        excerpt: document.getElementById('post-excerpt').value.trim(),
        content: editorHtml,
        author: document.getElementById('post-author').value.trim(),
        coverImage: currentCoverData
      };

      const btn = document.getElementById('btn-save');
      btn.disabled = true;
      btn.innerText = "กำลังบันทึก...";

      google.script.run
        .withSuccessHandler((res) => {
          btn.disabled = false;
          btn.innerText = "บันทึกบทความ";
          Swal.fire({ icon: 'success', title: res.message || 'บันทึกสำเร็จ', timer: 1500, showConfirmButton: false });
          resetWriteForm();
          navigate('home');
          fetchBlogList();
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          btn.innerText = "บันทึกบทความ";
          Swal.fire({ icon: 'error', title: 'บันทึกล้มเหลว', text: err.message });
        })
        .saveBlog(payload, sessionToken);
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
